[project]
name = "perfcomparator"
version = "0.5.0"
description = "Suite de benchmarks locaux et reproductibles pour macOS, Windows et Linux"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "psutil==7.1.0",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "wgpu==0.32.0",
]

[project.urls]
Homepage = "https://github.com/frchalaoux/perfcomparator"
Repository = "https://github.com/frchalaoux/perfcomparator.git"
Issues = "https://github.com/frchalaoux/perfcomparator/issues"
Documentation = "https://github.com/frchalaoux/perfcomparator/blob/main/DOCUMENTATION.md"

[project.scripts]
perfcomparator = "benchmark_mac.cli:app"
benchmark-mac = "benchmark_mac.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/comparaison.html"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_mac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
