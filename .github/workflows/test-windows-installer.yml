name: Windows installer tests

on:
  pull_request:
    paths:
      - .github/workflows/test-windows-installer.yml
      - install.bat
      - install.ps1
      - tests/windows/**
  push:
    branches:
      - feat/desktop-launcher
    paths:
      - .github/workflows/test-windows-installer.yml
      - install.bat
      - install.ps1
      - tests/windows/**

jobs:
  installer-smoke-test-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer smoke test in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\test-install.ps1

  installer-smoke-test-pwsh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer smoke test in PowerShell 7
        shell: pwsh
        run: .\tests\windows\test-install.ps1

  installer-real-smoke-test-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv without restoring a cache
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Report the real-install test toolchain
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          uv --version
      - name: Run the real installer with Windows PowerShell 5.1
        shell: powershell
        run: .\install.ps1
      - name: Verify the installed Python environment and Tkinter
        shell: powershell
        run: .\tests\windows\test-real-install.ps1
